name: Actualizar Catalogo

on:
  push:
    paths:
      - 'scraper/**.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: pip install pandas

      - name: Ejecutar script
        run: python scripts/procesar.py

      - name: Guardar cambios en productos.json
        run: |
          git config --global user.name "Bakano Bot"
          git config --global user.email "bot@bakano.com"
          git add productos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Actualizar productos.json" && git push)
