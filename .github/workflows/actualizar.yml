name: Actualizar Catalogo

on:
  push:
    paths:
      - 'scraper/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas

      - name: Run script
        run: python scripts/procesar.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Bakano Bot"
          git config --global user.email "bot@bakano.com"
          git add productos.json
          git diff --staged --quiet || (git commit -m "Auto: Actualizar productos.json" && git push)
